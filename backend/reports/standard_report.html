<!DOCTYPE html>
<html lang="en">
  <head>
    <style>
      title {
        font-size: 24px;
        font-weight: bold;
        text-align: center;
        margin-top: 20px;
      }
      h1 {
        font-size: 28px;
        color: #333;
        text-align: center;
        margin-top: 20px;
      }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{ title }</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      h1,
      h2 {
        color: #333;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }
      th {
        background-color: #f4f4f4;
      }
      .description {
        margin-top: 20px;
        font-size: 14px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h2>{{ report_title }}</h2>
      {% for data in data.items() %}
      {{ data[0] }}: {{ data[1] }}
      {{ data[2] }}
      {% endfor %}
    <p class="description">{{ report_description }}</p>
  </body>
</html>
